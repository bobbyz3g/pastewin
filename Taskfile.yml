version: '3'

vars:
  APP_NAME: pastewin
  BIN_DIR: bin
  PACKAGE_MANAGER: pnpm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Build the Windows application
    cmds:
      - task: windows:build
  package:
    summary: Build the Windows installer
    cmds:
      - task: windows:create:nsis:installer
  dev:
    summary: Run the Windows application with live reload
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  run:
    cmds:
      - task: windows:run
  test:
    cmds:
      - go test ./...
